name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: australia-southeast1-docker.pkg.dev
  REPO_PATH: field-engineering-apac/kasunt
  IMAGE_NAME: agentgateway-demo-wizard

jobs:
  lint-test-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned exact patch: golangci-lint v2.13.1 can't decode the export
          # data golang 1.27.2 emits (format version 5 vs its max of 4).
          go-version: "1.27.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      # web/embed.go's //go:embed all:dist needs the SPA built first -- dist/ is
      # gitignored, so a fresh checkout has no web/dist to embed.
      - run: npm ci && npm run build
        working-directory: web
      - run: gofmt -l . | tee /tmp/fmtdiff && [ ! -s /tmp/fmtdiff ]
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...
      - run: mkdir -p /tmp/build-out && go build -o /tmp/build-out/ ./...
      - run: go test ./... -v

  lint-test-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test -- --run

  build-push:
    needs: [lint-test-go, lint-test-ui]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for GCP Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          docker build -f Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

  create-release:
    needs: [build-push]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update release with image location
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPO_PATH}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          # release.yml may have already created this release (without the image,
          # which doesn't exist until build-push above runs) -- append rather than
          # fail if so, instead of clobbering its auto-generated notes.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            EXISTING=$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)
            printf '%s\n\n## Docker Image\n\n- `%s`\n' "$EXISTING" "$IMAGE" | gh release edit "${GITHUB_REF_NAME}" --notes-file -
          else
            printf '## Docker Image\n\n- `%s`\n' "$IMAGE" | gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --notes-file -
          fi
